# Novel2Script-AI Nginx site config
# Frontend static assets + /api reverse proxy to FastAPI (Uvicorn)

server {
    listen 80;
    server_name _;

    # Novel file upload limit (app-side cap is 10MB, headroom allowed here)
    client_max_body_size 20m;

    # Static asset caching (Vite output is content-hashed, safe to cache long)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history mode: fall back to index.html for refresh / direct route hits
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API reverse proxy (includes SSE endpoint /api/script/convert-stream)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE-critical: disable buffering; raise timeouts to 1h (long conversions take minutes)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
